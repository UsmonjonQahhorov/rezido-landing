name: Landing CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  REZIDO_API_URL: ''

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      evidence_status: ${{ steps.gates.outputs.evidence_status }}
      evidence_id: ${{ steps.gates.outputs.evidence_id }}
      evidence_repository: ${{ steps.gates.outputs.evidence_repository }}
      evidence_source_sha: ${{ steps.gates.outputs.evidence_source_sha }}
      evidence_mode: ${{ steps.gates.outputs.evidence_mode }}
      evidence_completed_at: ${{ steps.gates.outputs.evidence_completed_at }}
      evidence_input_sha256: ${{ steps.gates.outputs.evidence_input_sha256 }}
      evidence_manifest_sha256: ${{ steps.gates.outputs.evidence_manifest_sha256 }}
      release_envelope_sha256: ${{ steps.gates.outputs.release_envelope_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run mandatory quality gates
        id: gates
        run: python .github/ci/ci.py quality --kind landing
      - name: Publish safe diagnostics (best effort on cancellation)
        if: always() && steps.gates.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gates.outputs.evidence_path }}/*.json*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      evidence_status: ${{ steps.gates.outputs.evidence_status }}
      evidence_id: ${{ steps.gates.outputs.evidence_id }}
      evidence_repository: ${{ steps.gates.outputs.evidence_repository }}
      evidence_source_sha: ${{ steps.gates.outputs.evidence_source_sha }}
      evidence_mode: ${{ steps.gates.outputs.evidence_mode }}
      evidence_completed_at: ${{ steps.gates.outputs.evidence_completed_at }}
      evidence_input_sha256: ${{ steps.gates.outputs.evidence_input_sha256 }}
      evidence_manifest_sha256: ${{ steps.gates.outputs.evidence_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Strict installed-dependency audit (existing findings remain blocking)
        id: gates
        run: python .github/ci/ci.py dependencies --kind landing
      - name: Publish safe diagnostics (best effort on cancellation)
        if: always() && steps.gates.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gates.outputs.evidence_path }}/*.json*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence_status: ${{ steps.gates.outputs.evidence_status }}
      evidence_id: ${{ steps.gates.outputs.evidence_id }}
      evidence_repository: ${{ steps.gates.outputs.evidence_repository }}
      evidence_source_sha: ${{ steps.gates.outputs.evidence_source_sha }}
      evidence_mode: ${{ steps.gates.outputs.evidence_mode }}
      evidence_completed_at: ${{ steps.gates.outputs.evidence_completed_at }}
      evidence_input_sha256: ${{ steps.gates.outputs.evidence_input_sha256 }}
      evidence_manifest_sha256: ${{ steps.gates.outputs.evidence_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - name: Scan full history and checkout, redact values
        id: gates
        run: python .github/ci/ci.py secrets
      - name: Publish safe diagnostics (best effort on cancellation)
        if: always() && steps.gates.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gates.outputs.evidence_path }}/*.json*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [quality, dependencies, secrets]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download current prerequisite evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: landing-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence
          merge-multiple: false
      - name: Reject missing, failed, stale or mismatched prerequisite evidence
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/final_gate.py
